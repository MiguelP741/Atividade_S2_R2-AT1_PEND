<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Login Loja Espricio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <main class="container mt-5">

        <h1 id="tituloLoja" class="text-center mb-4">Loja Espricio</h1>

        <div class="card ">
            <div class="card-body">

                <h3 id="Home" class="text-center text-secondary">Home</h3>

                <h4 id="nomeCliente" class="text-success mt-2">Olá Usuário, como vai?</h4>

                <div class="input-group mb-3 mt-3">
                    <button id="btnAlterar" class="btn btn-primary btn-lg">
                        Alterar nome
                    </button>
                    <span class="input-group-text ms-2" id="Nome">Nome</span>
                    <input type="text" class="form-control" placeholder="Insira seu nome para alterar"
                        id="nomeAlterado">
                </div>

                <hr>

                <p id="mensagem" class="fw-bold"></p>

            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
