<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Login Loja Espricio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <main class="container mt-5">

        <h1 id="tituloLoja" class="text-center mb-4">Loja Espricio</h1>

        <div class="card">
            <div class="card-body">

                <h3 id="tituloCadastro" class="text-center text-secondary">Cadastro</h3>

                <div class="input-group mb-3">
                    <span class="input-group-text" id="basic-addon1">Nome</span>
                    <input type="text" class="form-control" placeholder="Insira seu nome" id="nomeCadastro">
                </div>

                <div class="d-grid">
                    <button id="btnCadastrar" class="btn btn-success btn-lg">
                        Cadastrar
                    </button>
                </div>

                <p id="mensagem" class="fw-bold"></p>
                
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html
